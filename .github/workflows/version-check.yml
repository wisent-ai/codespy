name: Version check

# Refuse a change whose declared version disagrees with what it did to the public
# contract. The contract of this tool is what a caller can observe: the rule ids it
# stamps findings with, the categories and severities it reports, the files it agrees
# to open, its output formats and its command line. Retiring a rule id silently stops
# failing a build that relied on it; that is a breaking change no matter how small the
# diff looks.
#
# The rule itself lives in one place for the whole fleet and is not copied here:
# https://github.com/lbartoszcze/AutoVersion. This workflow supplies only the two
# things this repository alone knows: its surface, and the version it declares.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make tags and history visible
        # actions/checkout fetches one commit and no tags. Every later read of a ref is
        # blind without this, and blind is worse than absent here: the tier probe would
        # find no tags, conclude the weaker tier is still the best available, and pass —
        # green on a laptop that happens to have refs, asleep on the runner. Unshallowing
        # matters separately from tag visibility, because `git archive <tag>` needs the
        # tag's tree, which a depth-one clone does not have.
        #
        # `--unshallow` is fatal on an already complete repository. Asking first, rather
        # than falling back through `||`, keeps a misleading "fatal:" out of the log.
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --force --tags --unshallow
          else
            git fetch --force --tags
          fi
          echo "tags visible: $(git tag -l | tr '\n' ' ')"

      - name: Install the shared rule
        # Never `pip install` into the system interpreter. `ubuntu-latest` resolves to an
        # Ubuntu whose python3 carries the externally-managed marker, so that spelling
        # dies with `error: externally-managed-environment` before any check runs -- a
        # permanently red gate, which by this fleet's own standard is worth exactly what a
        # sleeping one is worth and trains people to ignore a red build. Invisible from a
        # laptop, and invisible here too while Actions is billing-locked, because this step
        # has never once run on a runner.
        #
        # A venv sidesteps the marker without --break-system-packages, and appending its
        # bin to GITHUB_PATH leaves every later `autoversion` call spelled exactly as it
        # was. RUNNER_TEMP and GITHUB_PATH exist only on a runner, hence the defaults --
        # which are also what let this body be extracted and run locally, the only
        # technique available here that can falsify a claim about CI.
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:=$(mktemp -d)}"
          : "${GITHUB_PATH:=$(mktemp)}"
          python3 -m venv "$RUNNER_TEMP/rule"
          "$RUNNER_TEMP/rule/bin/python" -m pip install --quiet \
            "git+https://github.com/lbartoszcze/AutoVersion@v0.1.0"
          echo "$RUNNER_TEMP/rule/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH takes effect on the NEXT step only, so without this export the
          # assertion below would consult whatever `autoversion` was already on PATH --
          # including a stranger's, which would exit zero and vouch for a rule nobody
          # asked. Prepending after the install is what makes the venv win, and it is
          # load-bearing separately from the GITHUB_PATH line.
          export PATH="$RUNNER_TEMP/rule/bin:$PATH"

          # Which `autoversion` is about to answer? Establish that BEFORE asking it
          # anything. `--help` is satisfied by any executable that exits zero, so a
          # stranger earlier on PATH passes a liveness probe and then supplies every
          # verdict below -- and if the export above is ever dropped in an edit, the
          # symptom is a green step rather than a red one. Naming the resolved path is
          # what makes that failure visible instead of invisible.
          resolved="$(command -v autoversion || true)"
          case "$resolved" in
            "$RUNNER_TEMP/rule/bin/"*) ;;
            *)
              echo "::error::autoversion resolves to '${resolved:-nothing}', outside the" \
                "venv this step just built, so a stranger would answer for the rule and" \
                "every verdict below would be its word rather than the rule's."
              false
              ;;
          esac

          # Then two DIFFERENT known answers, because one cannot be enough: a saboteur
          # that always says `internal` passes a single-answer probe AND the gate's own
          # steps, since with the declared version equal to the released one `internal`
          # IS the passing branch. Identical surfaces must read `internal`; a surface
          # with one name removed must read `breaking`. That second arm is the only
          # thing here that requires the gate to be ABLE TO REFUSE.
          #
          # Both sides are built from the COMMITTED baseline rather than a synthetic
          # pair, so this same step also proves the frozen file parses and that it is
          # the file reaching the decision. The name is dropped without a bare index,
          # which this workspace refuses. An empty candidate would be no use as the
          # breaking case -- the rule rejects it outright as a far more likely broken
          # extractor.
          shrunk="$RUNNER_TEMP/shrunk.json"
          jq '{surface: (.surface - [(.surface | sort | first)])}' \
            released-surface.json > "$shrunk"
          current="$(jq -r .version released-surface.json)"
          unchanged="$(autoversion decide --current "$current" \
            --published-surface released-surface.json \
            --candidate-surface released-surface.json --json | jq -r .change)"
          removed="$(autoversion decide --current "$current" \
            --published-surface released-surface.json \
            --candidate-surface "$shrunk" --json | jq -r .change)"
          if [ "$unchanged" != internal ] || [ "$removed" != breaking ]; then
            echo "::error::the rule does not answer as the rule: the committed surface" \
              "against itself read '$unchanged', and with one name removed it read" \
              "'$removed'. Something other than AutoVersion is answering, so no verdict" \
              "below means anything."
            false
          fi

      - name: Read the public surface
        # No dependencies: the surface is read out of codespy.py with ast, so this
        # stays cheap and never runs the scanner. A module that does not parse fails
        # the step rather than silently shrinking the surface.
        run: python3 scripts/surface.py > "$RUNNER_TEMP/candidate.json"

      - name: Prove this gate can still refuse
        run: |
          set -euo pipefail
          # A gate that has never refused is decoration, and the install step's probe does
          # not cover the step below. That probe interrogated an `autoversion` it had put
          # on PATH with an `export` in its OWN shell; every later step, including the one
          # that consumes the real verdict, resolves the name through GITHUB_PATH instead.
          # Those are two different resolutions, and only one of them was proved. Drop,
          # misspell or reorder the GITHUB_PATH line and the install step still passes
          # while a stranger answers from here on -- and a stranger that always answers
          # `internal` sails through the comparison below, because while codespy.py
          # declares the released version `internal` IS the passing branch. So the ability
          # to refuse is demanded again, from the same resolution the verdict below is read
          # from, immediately before it is read.
          #
          # Built out of the COMMITTED baseline rather than a synthetic pair, so this also
          # proves the frozen file parses, carries a surface, and is really what reaches a
          # decision. One name is dropped with `- [first]` rather than a bare subscript,
          # which this workspace refuses. All but one of the baseline's names survive, so
          # the candidate is never the empty surface the rule rejects outright as the far
          # likelier broken extractor.
          dropped="$(jq -r '.surface | sort | first' released-surface.json)"
          jq '{surface: (.surface - [(.surface | sort | first)])}' \
            released-surface.json > "$RUNNER_TEMP/refusal.json"
          released="$(jq -r .version released-surface.json)"
          # `|| true` so an `autoversion` that crashes or prints no verdict is reported by
          # the message below, naming the removal it was asked about, instead of killing
          # the step with a stack trace. Safe only because nothing but the literal
          # `breaking` passes: an empty answer falls through to the refusal.
          verdict="$(autoversion decide --current "$released" \
            --published-surface released-surface.json \
            --candidate-surface "$RUNNER_TEMP/refusal.json" \
            --json | jq -r .change || true)"
          if [ "$verdict" != breaking ]; then
            echo "::error::removing '$dropped' from the released contract $released read" \
              "'${verdict:-<nothing>}' instead of breaking, so this gate cannot refuse a" \
              "removal and the verdict consumed by the next step is worth nothing. Fix the" \
              "check; do not touch the baseline."
            false
          fi
          echo "Removing '$dropped' is refused as breaking, so this gate can refuse."

      - name: Compare against the released contract
        run: |
          set -euo pipefail
          released="$(jq -r .version released-surface.json)"
          declared="$(awk -F'"' '/^__version__/{print $2; exit}' codespy.py)"
          echo "released: $released"
          echo "declared: $declared"

          verdict="$(autoversion decide \
            --current "$released" \
            --published-surface released-surface.json \
            --candidate-surface "$RUNNER_TEMP/candidate.json" \
            --json)"
          echo "$verdict"

          change="$(printf '%s' "$verdict" | jq -r .change)"
          required="$(printf '%s' "$verdict" | jq -r .next)"

          if [ "$declared" = "$released" ]; then
            if [ "$change" != "internal" ]; then
              echo "::error::The public contract changed ($change) but codespy.py still" \
                "declares the released version $released. The next version must be $required."
              false
            fi
            echo "Nothing new released and the contract is unchanged."
          elif [ "$declared" != "$required" ]; then
            echo "::error::codespy.py declares $declared, but a $change change to" \
              "$released requires $required."
            false
          else
            echo "Declared version matches the $change change."
          fi

      - name: Refuse a baseline that misstates where it came from
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # released-surface.json is the yardstick every later comparison is measured
          # against, so it must say truthfully where it came from. The check runs both
          # ways, because both lies are equally destructive:
          #
          #   claims published, is not  -> the baseline was hand-edited and nobody can
          #                                reproduce it
          #   is published, claims less -> a real artifact exists and was ignored, so
          #                                the yardstick is not what users have
          #
          # The two files are coupled by a provenance marker, not by prose a reword
          # could silently break: the marker is the first whitespace-delimited token of
          # "source", everything after the first space is prose for humans, and
          # scripts/baseline.py is the only thing that writes it. Tiers, best first:
          # pypi-sdist, pypi-wheel, stado, git-archive, head.
          released="$(jq -r .version released-surface.json)"
          marker="$(jq -r '.source | split(" ") | first' released-surface.json)"
          echo "baseline $released via marker '$marker'"

          case "$marker" in
            pypi-*) claims_registry=yes ;;
            stado:*|git-archive:*|head:*) claims_registry=no ;;
            *)
              echo "::error::unknown baseline marker: $marker. Run scripts/baseline.py."
              false
              ;;
          esac

          # Forward: a marker that claims the index must be served that exact version.
          # Reverse: a marker that claims no index must face an index serving nothing,
          # because a real release the baseline is dodging outranks every lower tier.
          #
          # The reverse direction is the dangerous one: it reads absence, and absence is
          # the passing answer, so every way of learning nothing has to be excluded. An
          # exit status cannot do that — under `-sSf` a missing project, no egress, a DNS
          # failure, an outage, a rate-limit page and a permission refusal all look
          # identical, and a reachability control only rules out the transport ones. A
          # refusal or a throttle is a successful request whose answer means nothing, so
          # it sails past any control.
          #
          # So demand testimony instead of inference: read what the index SAYS. PyPI names
          # a project it serves, and says "Not Found" about one it does not. Three
          # outcomes, and only the middle one passes:
          #   names codespy       -> published, the baseline is dodging a release
          #   states not found    -> absence, attested by an answer that arrived
          #   anything else       -> no usable answer, so absence is unproven
          # `|| true` is safe only because both non-passing branches demand specific
          # content and the fallthrough refuses. Never let an empty answer mean ok.
          if [ "$claims_registry" = yes ]; then
            if ! curl -sSf "https://pypi.org/pypi/codespy/$released/json" >/dev/null; then
              echo "::error::baseline claims $marker, but PyPI does not serve codespy" \
                "$released. Run scripts/baseline.py."
              false
            fi
            echo "PyPI serves codespy $released, as $marker claims."
          else
            answer="$(curl -s "https://pypi.org/pypi/codespy/json" || true)"
            if printf '%s' "$answer" | jq -e '.info.name' >/dev/null; then
              echo "::error::baseline claims $marker, which asserts nothing is published," \
                "but PyPI names codespy. Run scripts/baseline.py."
              false
            elif ! printf '%s' "$answer" \
                 | jq -e '(.message // "") | ascii_downcase | contains("not found")' \
                   >/dev/null; then
              echo "::error::PyPI gave no usable answer about codespy, so its absence is" \
                "unproven. Refusing rather than assuming it is unpublished."
              false
            fi
            echo "PyPI states codespy is not found, as $marker claims."
          fi

          # Tags and full history were made visible in a step of their own after
          # checkout, which the branches below depend on.

          # The newest version any tag actually carries. A baseline older than this is
          # stale no matter which tier it names, and the ordering question goes to the
          # shared rule rather than being reinvented in shell.
          newest_tag=""
          newest_version=""
          for candidate in $(git tag -l); do
            there="$(git show "$candidate:codespy.py" \
              | awk -F'"' '/^__version__/{print $2; exit}')" || continue
            if [ -z "$there" ]; then
              continue
            fi
            if [ -z "$newest_version" ] || [ "$(autoversion order --older "$newest_version" \
                 --newer "$there" --json | jq -r .is_newer)" = "True" ]; then
              newest_tag="$candidate"
              newest_version="$there"
            fi
          done

          case "$marker" in
            git-archive:*)
              tag="${marker#git-archive:}"
              if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
                echo "::error::baseline claims git tag $tag, which this repository does" \
                  "not have. Run scripts/baseline.py."
                false
              fi
              tagged="$(git show "$tag:codespy.py" | awk -F'"' '/^__version__/{print $2; exit}')"
              if [ "$tagged" != "$released" ]; then
                echo "::error::git tag $tag declares $tagged, not $released, so the" \
                  "baseline is measured against an artifact that is not that version." \
                  "Run scripts/baseline.py."
                false
              fi
              echo "Baseline $released is the artifact at git tag $tag."
              ;;
            head:*)
              if [ -n "$newest_tag" ]; then
                echo "::error::baseline claims $marker, but git tag $newest_tag carries" \
                  "$newest_version and is the artifact callers get. head is the last" \
                  "resort only. Run scripts/baseline.py."
                false
              fi
              echo "Baseline $released is HEAD; no tag and no release exist, as claimed."
              ;;
          esac

          if [ -n "$newest_version" ] && [ "$newest_version" != "$released" ] \
             && [ "$(autoversion order --older "$released" --newer "$newest_version" \
                    --json | jq -r .is_newer)" = "True" ]; then
            echo "::error::git tag $newest_tag carries $newest_version, which is newer" \
              "than the baseline $released. Every comparison is being measured against a" \
              "superseded artifact. Run scripts/baseline.py."
            false
          fi

          # Being honest about your tier is not the same as being on the right one. A
          # release or a tag can appear after the baseline was generated, and from then
          # on the baseline stays perfectly truthful while a better artifact sits unused.
          # So ask the generator which artifact is reachable right now and compare.
          #
          # Compare the WHOLE marker on every tier except head, and the tier alone on
          # head. A head: marker carries a sha that moves with every commit, so full
          # equality there would demand a regeneration per commit forever; every other
          # tier names its artifact exactly, by filename or by tag, and those do not
          # move, so full equality is safe and strictly tighter. Tier-prefix alone would
          # wave through the right KIND of artifact while the wrong one is named — an
          # older sdist beside a newer release, or a tag outranked by a better tag.
          #
          # Only the marker is read from this. The regenerated surface must never reach
          # the decision: recomputing both sides at check time is the one shape that
          # structurally cannot refuse, and --stdout exists so the committed baseline is
          # never rewritten here. Do not "simplify" this into feeding the decision.
          #
          # And do NOT fold it back into `best="$(generator | jq ...)"`, which is how this
          # was first written. Inside a command substitution containing a pipeline the
          # generator's exit status is discarded and `set -e` does not reach in, so a dead
          # generator yields an empty `best` -- which refuses while blaming the wrong
          # thing, and would pass vacuously if the committed marker ever also read empty.
          # Run it into a file, test its status, then demand both markers be non-empty
          # before comparing them. (The line continuation hid this from the fleet audit,
          # whose pattern wants the pipe and the generator on one line; the defect was
          # there all the same.)
          if ! python3 scripts/baseline.py --stdout > "$RUNNER_TEMP/best.json"; then
            echo "::error::scripts/baseline.py could not establish the best reachable" \
              "artifact, so whether this baseline is stale is unproven. That is not the" \
              "same as up to date."
            false
          fi
          best="$(jq -r '.source | split(" ") | first' "$RUNNER_TEMP/best.json")"
          # Non-empty is not enough, and `-n` alone is the fail-open half of this guard:
          # on a document whose `.source` is the empty string this exact expression hands
          # back the literal four-character string `null` with a zero exit (measured), so
          # `-n` waves it through -- and if the committed marker ever read the same way,
          # `null` would be compared with `null` and the step would pass vacuously, which
          # is the one outcome a frozen file exists to prevent.
          for token in "$marker" "$best"; do
            case "${token:-}" in
              ''|null)
                echo "::error::a marker read '${token:-<empty>}' ('$marker' committed," \
                  "'$best' regenerated), so this comparison would be vacuous. The" \
                  "baseline's .source is missing or empty; run scripts/baseline.py."
                false
                ;;
            esac
          done
          if [ "${marker%%:*}" = head ]; then
            want="${best%%:*}"
            have="${marker%%:*}"
          else
            want="$best"
            have="$marker"
          fi
          if [ "$want" != "$have" ]; then
            echo "::error::the baseline names '$have' but '$want' is reachable now, so a" \
              "better artifact exists than the one every comparison is measured against." \
              "Run scripts/baseline.py."
            false
          fi
          echo "Baseline artifact '$have' is still the best reachable."
