name: 'codespy'
description: 'Fast, offline code security scanner. Zero dependencies. Finds secrets, injection vulnerabilities, misconfigurations, and code quality issues across 13+ languages.'
author: 'wisent-ai'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Path to scan (relative to workspace root)'
    required: false
    default: '.'
  severity:
    description: 'Minimum severity to report: info, low, medium, high, critical'
    required: false
    default: 'low'
  format:
    description: 'Output format: terminal, json, sarif, markdown'
    required: false
    default: 'sarif'
  output-file:
    description: 'File path for output (when using json/sarif/markdown format)'
    required: false
    default: 'codespy-results.sarif'
  fail-on-findings:
    description: 'Fail the action if findings at or above this severity are found. Set to "none" to never fail.'
    required: false
    default: 'high'
  show-fixes:
    description: 'Include fix suggestions in output'
    required: false
    default: 'true'
  upload-sarif:
    description: 'Automatically upload SARIF results to GitHub Code Scanning (requires sarif format)'
    required: false
    default: 'true'
  scoring-policy:
    description: 'Path to an explicit scoring policy JSON; omitted means no score or grade'
    required: false

outputs:
  total-findings:
    description: 'Total number of findings'
    value: ${{ steps.scan.outputs.total_findings }}
  critical-count:
    description: 'Number of critical findings'
    value: ${{ steps.scan.outputs.critical_count }}
  high-count:
    description: 'Number of high findings'
    value: ${{ steps.scan.outputs.high_count }}
  medium-count:
    description: 'Number of medium findings'
    value: ${{ steps.scan.outputs.medium_count }}
  low-count:
    description: 'Number of low findings'
    value: ${{ steps.scan.outputs.low_count }}
  security-score:
    description: 'Score under the supplied policy, or null when unavailable'
    value: ${{ steps.scan.outputs.security_score }}
  security-grade:
    description: 'Grade under the supplied policy, or null when unavailable'
    value: ${{ steps.scan.outputs.security_grade }}
  scoring-policy:
    description: 'JSON of the policy used, or null when none was supplied'
    value: ${{ steps.scan.outputs.scoring_policy }}
  sarif-file:
    description: 'Path to SARIF output file (if generated)'
    value: ${{ steps.scan.outputs.sarif_file }}

runs:
  using: 'composite'
  steps:
    - name: Install codespy
      # The scanner is the Rust program in this repository, built once per job
      # from the exact ref the workflow pinned.
      shell: bash
      run: |
        cargo install --quiet --locked --path "${{ github.action_path }}" --root "$RUNNER_TEMP/codespy"
        echo "$RUNNER_TEMP/codespy/bin" >> "$GITHUB_PATH"

    - name: Run codespy scan
      id: scan
      shell: bash
      # Inputs reach the shell as environment values and are passed as array
      # elements, so a path or file name with spaces or shell characters stays
      # one argument and is never run as code.
      env:
        SCAN_PATH: ${{ inputs.path }}
        SEVERITY: ${{ inputs.severity }}
        FORMAT: ${{ inputs.format }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        SHOW_FIXES: ${{ inputs.show-fixes }}
        FAIL_LEVEL: ${{ inputs.fail-on-findings }}
        SCORING_POLICY: ${{ inputs.scoring-policy }}
      run: |
        args=("$SCAN_PATH" --severity "$SEVERITY" --no-color)
        policy_args=()
        if [ -n "$SCORING_POLICY" ]; then
          policy_args+=(--scoring-policy "$SCORING_POLICY")
          args+=("${policy_args[@]}")
        fi
        if [ "$SHOW_FIXES" = "true" ]; then
          args+=(--fix)
        fi
        if [ "$FORMAT" != "terminal" ]; then
          args+=(--format "$FORMAT")
          if [ -n "$OUTPUT_FILE" ]; then
            args+=(-o "$OUTPUT_FILE")
          fi
        fi

        echo "::group::codespy scan command"
        printf '%q ' codespy "${args[@]}"
        echo
        echo "::endgroup::"

        # The JSON report states the counts, score and grade. A report that was
        # not written is a failed scan, not a clean one.
        JSON_TMP=$(mktemp)
        set +e
        codespy "$SCAN_PATH" --severity "$SEVERITY" "${policy_args[@]}" --format json -o "$JSON_TMP" --no-color
        JSON_EXIT=$?
        set -e
        if { [ "$JSON_EXIT" -ne 0 ] && [ "$JSON_EXIT" -ne 1 ]; } || [ ! -s "$JSON_TMP" ]; then
          rm -f "$JSON_TMP"
          echo "::error::codespy JSON report failed for $SCAN_PATH (exit $JSON_EXIT); see diagnostics above"
          exit 1
        fi
        TOTAL=$(jq -r .total_findings "$JSON_TMP")
        CRITICAL=$(jq -r .severity_counts.critical "$JSON_TMP")
        HIGH=$(jq -r .severity_counts.high "$JSON_TMP")
        MEDIUM=$(jq -r .severity_counts.medium "$JSON_TMP")
        LOW=$(jq -r .severity_counts.low "$JSON_TMP")
        SCORE=$(jq -r .security_score "$JSON_TMP")
        GRADE=$(jq -r .security_grade "$JSON_TMP")
        POLICY=$(jq -c .scoring.policy "$JSON_TMP")
        SCORE_TOP=$(jq -r .scoring.policy.top_score "$JSON_TMP")
        SCORE_REASON=$(jq -r '.scoring.reason // empty' "$JSON_TMP")
        rm -f "$JSON_TMP"

        {
          echo "total_findings=$TOTAL"
          echo "critical_count=$CRITICAL"
          echo "high_count=$HIGH"
          echo "medium_count=$MEDIUM"
          echo "low_count=$LOW"
          echo "security_score=$SCORE"
          echo "security_grade=$GRADE"
          echo "scoring_policy=$POLICY"
        } >> "$GITHUB_OUTPUT"

        # The scan in the requested format. Exit 1 only means findings at high
        # or above, which the threshold below decides on; 3 is a scan that could
        # not read everything it selected, and 2 or 4 a scan that never produced
        # its report.
        set +e
        codespy "${args[@]}"
        SCAN_EXIT=$?
        set -e
        if [ "$SCAN_EXIT" -eq 3 ]; then
          echo "::error::codespy could not read part of $SCAN_PATH, so the scan is incomplete"
          exit 1
        fi
        if [ "$SCAN_EXIT" -ne 0 ] && [ "$SCAN_EXIT" -ne 1 ]; then
          echo "::error::codespy exited $SCAN_EXIT without a complete report"
          exit 1
        fi

        if [ "$FORMAT" = "sarif" ] && [ -f "$OUTPUT_FILE" ]; then
          echo "sarif_file=$OUTPUT_FILE" >> "$GITHUB_OUTPUT"
        fi

        {
          echo "## codespy Security Scan Results"
          echo ""
          echo "| Metric | Value |"
          echo "|--------|-------|"
          if [ "$SCORE" = "null" ]; then
            echo "| Security Score | Unavailable: $SCORE_REASON |"
          else
            echo "| Security Score | **$SCORE/$SCORE_TOP** (Grade: $GRADE) |"
          fi
          echo "| Total Findings | $TOTAL |"
          if [ "$CRITICAL" -gt 0 ]; then echo "| :red_circle: Critical | **$CRITICAL** |"; fi
          if [ "$HIGH" -gt 0 ]; then echo "| :orange_circle: High | **$HIGH** |"; fi
          if [ "$MEDIUM" -gt 0 ]; then echo "| :yellow_circle: Medium | $MEDIUM |"; fi
          if [ "$LOW" -gt 0 ]; then echo "| :large_blue_circle: Low | $LOW |"; fi
          echo ""
          if [ "$POLICY" != "null" ]; then
            echo "Scoring policy:"
            echo '```json'
            printf '%s\n' "$POLICY"
            echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        SHOULD_FAIL=0
        if [ "$FAIL_LEVEL" = "critical" ] && [ "$CRITICAL" -gt 0 ]; then
          SHOULD_FAIL=1
        elif [ "$FAIL_LEVEL" = "high" ] && [ $((CRITICAL + HIGH)) -gt 0 ]; then
          SHOULD_FAIL=1
        elif [ "$FAIL_LEVEL" = "medium" ] && [ $((CRITICAL + HIGH + MEDIUM)) -gt 0 ]; then
          SHOULD_FAIL=1
        elif [ "$FAIL_LEVEL" = "low" ] && [ "$TOTAL" -gt 0 ]; then
          SHOULD_FAIL=1
        fi
        if [ "$SHOULD_FAIL" -eq 1 ]; then
          echo "::error::codespy found findings at or above '$FAIL_LEVEL' severity; scoring does not override this threshold"
          exit 1
        fi

    - name: Upload SARIF to GitHub Code Scanning
      if: inputs.format == 'sarif' && inputs.upload-sarif == 'true' && always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output-file }}
      continue-on-error: true
