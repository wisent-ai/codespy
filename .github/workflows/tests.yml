name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check that codespy.py matches codespy_core
        run: python3 tools/build_codespy.py --check

      - name: Run tests
        run: python3 tests/run.py

      - name: Self-scan (security check)
        run: python3 codespy.py . --severity high --no-color || true
